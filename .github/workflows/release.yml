name: release

on:
    push:
        branches:
            - main

jobs:
    check_tag:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: "0"

            - name: Bump version and push tag
              id: check_tag
              uses: anothrNick/github-tag-action@1.75.0
              env:
                  WITH_V: true
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DEFAULT_BUMP: none
                  RELEASE_BRANCHES: main

        outputs:
            bump: ${{ steps.check_tag.outputs.part }}
            new_tag: ${{ steps.check_tag.outputs.new_tag }}

    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        needs: [check_tag]
        if: needs.check_tag.outputs.bump != '' && needs.check_tag.outputs.bump != 'none'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: "0"

            - name: Get previous tag
              id: prev_tag
              run: |
                  TAG=$(git tag --sort=-creatordate | grep '^v' | grep -vxF "${{ needs.check_tag.outputs.new_tag }}" | head -n 1)
                  echo "tag=$TAG" >> $GITHUB_OUTPUT

            - name: Get commit messages since last tag
              id: changelog
              run: |
                  PREV_TAG="${{ steps.prev_tag.outputs.tag }}"
                  # First release has no previous tag, so include the full history
                  if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi
                  log=$(git log "$RANGE" --pretty=format:"%s")
                  # Strip #patch, #minor, and #major
                  cleaned_log=$(echo "$log" | sed -E 's/\s*(#patch|#minor|#major)\b//g')
                  echo "log<<EOF" >> $GITHUB_OUTPUT
                  echo "$cleaned_log" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create Github release
              id: create_release
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ needs.check_tag.outputs.new_tag }}
                  name: Release ${{ needs.check_tag.outputs.new_tag }}
                  body: ${{ steps.changelog.outputs.log }}
                  draft: false
                  prerelease: false
